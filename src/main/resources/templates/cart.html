<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        a { color: darkred; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<h1>🛒 Your Shopping Cart</h1>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Category ID</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${cart}">
        <td th:text="${item.product.name}"></td>
        <td th:text="${item.product.description}"></td>
        <td th:text="${item.product.category.id}"></td>

        <!-- NEW -->
        <td th:text="${item.startDate}"></td>
        <td th:text="${item.endDate}"></td>

        <td>
            <a th:href="@{'/cart/remove/' + ${item.product.id}}">Remove</a>
        </td>
    </tr>
    </tbody>
</table>
<!-- ✅ NEW BUTTON TO GO TO CHECKOUT -->
<form action="/checkout" method="get">
    <button type="submit" class="checkout-btn">Proceed to Checkout ✅</button>
</form>

<a href="/products">⬅ Back to Products</a>

</body>
</html>
