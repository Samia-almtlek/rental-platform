<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- 🔥 NAVBAR -->
<th:block th:replace="fragments :: navbar"></th:block>

<h1> Checkout:</h1>

<!-- Show message if cart is empty -->
<p th:if="${message}" th:text="${message}" class="message"></p>


<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>Product</th>
            <th>Description</th>
            <th>Category ID</th>
            <th>Start Date</th>
            <th>End Date</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${cart}">
            <td th:text="${item.product.name}">Product name</td>
            <td th:text="${item.product.description}">Product description</td>
            <td th:text="${item.product.category.id}">Category ID</td>
            <td th:text="${item.startDate}"></td>
            <td th:text="${item.endDate}"></td>
        </tr>
        </tbody>
    </table>
</div>


<div class="center-btn">
    <form action="/checkout/confirm" method="post">
        <button type="submit" class="checkout-btn"> Confirm Order</button>
    </form>
</div>

<!-- Back link -->
<p style="text-align: center; margin-top: 10px;">
    <a href="/cart">⬅ Back to Cart</a>
</p>

<!-- 🔥 FOOTER -->
<th:block th:replace="fragments :: footer"></th:block>

</body>
</html>
