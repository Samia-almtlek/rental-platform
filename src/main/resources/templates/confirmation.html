<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- 🔥 NAVBAR -->
<th:block th:replace="fragments :: navbar"></th:block>

<h1>✅ Order Confirmed!</h1>

<p style="text-align:center; font-size:18px; margin-bottom: 20px;">
    Your order has been successfully placed.
</p>


<div class="table-container">

    <table>
        <thead>
        <tr>
            <th>Field</th>
            <th>Details</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td><strong>Order ID</strong></td>
            <td th:text="${order.id}">1</td>
        </tr>

        <tr>
            <td><strong>Status</strong></td>
            <td th:text="${order.status}">Confirmed</td>
        </tr>

        <tr>
            <td><strong>Start Date</strong></td>
            <td th:text="${order.startDate}">2025-11-14</td>
        </tr>

        <tr>
            <td><strong>End Date</strong></td>
            <td th:text="${order.endDate}">2025-11-21</td>
        </tr>
        </tbody>
    </table>

</div>

<!-- Back Button -->
<p style="text-align:center; margin-top:15px;">
    <a href="/products">⬅ Back to Product Catalog</a>
</p>

<!-- 🔥 FOOTER -->
<th:block th:replace="fragments :: footer"></th:block>

</body>
</html>
