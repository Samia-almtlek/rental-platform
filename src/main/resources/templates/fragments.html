<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Fragments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">



</head>


<body>

<!-- ==================== HEADER / NAVBAR ==================== -->
<div th:fragment="navbar">
    <div class="navbar">

        <div class="nav-left">
            <a href="/products"><strong> Rental Platform</strong></a>

            <a href="/cart"> Cart</a>
            <a href="/my-orders"> My Orders</a>
        </div>

        <div class="nav-right">
            <span sec:authorize="isAuthenticated()" class="username">
                Welcome, <span sec:authentication="name"></span>
            </span>

            <a sec:authorize="!isAuthenticated()" href="/login">Login</a>
            <a sec:authorize="isAuthenticated()" href="/logout">Logout</a>
        </div>

    </div>
</div>


</div>


<!-- ==================== FOOTER ==================== -->
<div th:fragment="footer">
    <div class="footer">
        © 2025 Rental Platform – Made for EhB Enterprise Applications
    </div>
</div>

</body>
</html>
