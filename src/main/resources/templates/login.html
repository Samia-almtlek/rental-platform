<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial; background-color: #f5f5f5; text-align: center; padding-top: 100px; }
        form { background: white; padding: 30px; border-radius: 8px; display: inline-block; }
        input { margin: 10px; padding: 8px; width: 200px; }
        button { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<h2>Please sign in</h2>
<form th:action="@{/login}" method="post">
    <input type="text" name="email" placeholder="Email" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <button type="submit">Sign in</button>
</form>

<p>Don’t have an account? <a th:href="@{/register}">Register here</a></p>

</body>
</html>
