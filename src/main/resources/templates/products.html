<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">



</head>

<body>

<!-- 🔥 NAVBAR -->
<th:block th:replace="fragments :: navbar"></th:block>

<h1> Product Catalog</h1>

<!-- CATEGORY DROPDOWN FILTER (PURE THYMELEAF, NO JS) -->

<form method="get" th:action="@{/products}" class="filter-container">
    <label><strong>Filter by Category:</strong></label>

    <select name="category" onchange="this.form.submit()">
        <option th:value="all"
                th:selected="${currentCategory == 'all'}">
            All Products
        </option>

        <option th:value="1"
                th:selected="${currentCategory == '1'}">
            Lighting
        </option>

        <option th:value="2"
                th:selected="${currentCategory == '2'}">
            Cables
        </option>

        <option th:value="3"
                th:selected="${currentCategory == '3'}">
            Control Panels
        </option>
    </select>
</form>

<div class="product-list">

    <!-- PRODUCT LOOP -->
    <div th:each="product : ${products}" class="product-card">

        <h3 th:text="${product.name}">Product Name</h3>

        <p th:text="${product.description}"></p>

        <p>
            <span th:if="${product.available}" class="available">Available</span>
            <span th:if="${!product.available}" class="not-available">Not Available</span>
        </p>

        <p><strong>Category ID:</strong> <span th:text="${product.category.id}"></span></p>

        <!-- RENTAL FORM -->
        <form th:action="@{/cart/add}" method="post">
            <input type="hidden" name="productId" th:value="${product.id}" />

            <label>From:</label>
            <input type="date" name="startDate" required>

            <label>To:</label>
            <input type="date" name="endDate" required>

            <button type="submit" class="add-button">🛒 Add to Cart</button>
        </form>

    </div>
</div>

<!-- 🔥 FOOTER -->
<th:block th:replace="fragments :: footer"></th:block>

</body>
</html>
