<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f8f8; margin: 40px; }
        .container { width: 400px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 10px; color: #555; }
        input[type=text], input[type=password], input[type=email] {
            width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;
        }
        button {
            width: 100%; margin-top: 20px; background-color: #007bff; color: white;
            border: none; padding: 10px; border-radius: 5px; cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        p { text-align: center; margin-top: 15px; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Create Account</h2>

    <form th:action="@{/register}" method="post" th:object="${user}">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required>

        <label for="password">Password:</label>
        <input type="password" id="password" th:field="*{password}" required>

        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="/login">Login here</a></p>
</div>

</body>
</html>
