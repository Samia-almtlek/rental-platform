<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- SIMPLE COLORED HEADER WITHOUT NAVBAR -->
<div class="auth-header"></div>

<!-- REGISTER CARD -->
<div class="auth-container">
    <h2>Create Account</h2>

    <form th:action="@{/register}" method="post" th:object="${user}">
        <label>Name:</label>
        <input type="text" th:field="*{name}" class="auth-input" required>

        <label>Email:</label>
        <input type="email" th:field="*{email}" class="auth-input" required>

        <label>Password:</label>
        <input type="password" th:field="*{password}" class="auth-input" required>

        <button type="submit" class="auth-button">Register</button>
    </form>

    <div class="auth-link">
        Already have an account?
        <a href="/login">Login here</a>
    </div>
</div>

<!-- FOOTER -->
<div class="footer">
    © 2025 Rental Platform – Made for EhB Enterprise Applications
</div>

</body>
</html>
